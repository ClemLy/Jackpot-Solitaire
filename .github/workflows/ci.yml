name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Qualite (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Verification du formatage
        run: npm run format:check

      - name: Analyse statique (ESLint)
        run: npm run lint

      - name: Verification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build

  deploy:
    name: Deploiement GitHub Pages
    # On ne deploie que lors d'un push sur main, apres la passe qualite.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Build de production (base adaptee au sous-chemin Pages)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Envoi de l artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploiement
        id: deployment
        uses: actions/deploy-pages@v4
